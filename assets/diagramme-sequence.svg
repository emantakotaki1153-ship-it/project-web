<text x="492.5" y="254" font-family="Consolas, 'Cascadia Code', monospace" font-size="13" font-weight="400" fill="#18212B" text-anchor="middle" stroke="#F6F7F8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">playRound(&quot;rock&quot;)</text>
<line x1="610" y1="315" x2="375" y2="315" stroke="#5B6572" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
<text x="492.5" y="304" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5B6572" text-anchor="middle" stroke="#F6F7F8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">affiche le coup du joueur</text>
<line x1="610" y1="370" x2="835" y2="370" stroke="#18212B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#solidArrow)"/>
