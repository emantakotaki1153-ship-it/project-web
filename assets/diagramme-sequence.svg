<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" role="img" aria-labelledby="seq-title seq-desc">
<title id="seq-title">Diagramme de séquence — jouer une manche</title>
<desc id="seq-desc">Le clic du joueur est transmis au script, qui tire un coup au hasard, arbitre la manche, puis met à jour l’affichage et le score.</desc>
<rect width="1240" height="760" fill="#F6F7F8"/>
<defs>
<marker id="solidArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L10.5 6 L1.5 10.5 Z" fill="#18212B"/></marker>
<marker id="openArrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L10.5 6 L1.5 10.5" fill="none" stroke="#5B6572" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="56" y="44" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18212B" text-anchor="start">UML — Diagramme de séquence : jouer une manche</text>
<text x="56" y="70" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5B6572" text-anchor="start">Du clic du joueur à la mise à jour du score</text>
<rect x="60" y="106" width="170" height="62" rx="10" fill="#FFFFFF" stroke="#9CBFDF" stroke-width="1.4"/>
<line x1="61" y1="107.5" x2="229" y2="107.5" stroke="#18212B" stroke-width="4" stroke-linecap="round"/>
<text x="145" y="133" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" fill="#18212B" text-anchor="middle">Joueur</text>
<text x="145" y="154" font-family="Consolas, 'Cascadia Code', monospace" font-size="11.5" font-weight="400" fill="#5B6572" text-anchor="middle">utilisateur</text>
<line x1="145.0" y1="168" x2="145.0" y2="700" stroke="#9CBFDF" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="280" y="106" width="190" height="62" rx="10" fill="#FFFFFF" stroke="#9CBFDF" stroke-width="1.4"/>
<line x1="281" y1="107.5" x2="469" y2="107.5" stroke="#0868E0" stroke-width="4" stroke-linecap="round"/>
<text x="375" y="133" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" fill="#18212B" text-anchor="middle">Interface</text>
<text x="375" y="154" font-family="Consolas, 'Cascadia Code', monospace" font-size="11.5" font-weight="400" fill="#5B6572" text-anchor="middle">index.html</text>
<line x1="375.0" y1="168" x2="375.0" y2="700" stroke="#9CBFDF" stroke-width="1.4" stroke-dasharray="5 5"/>
<rect x="520" y="106" width="180" height="62" rx="10" fill="#FFFFFF" stroke="#9CBFDF" stroke-width="1.4"/>
<line x1="521" y1="107.5" x2="699" y2="107.5" stroke="#0868E0" stroke-width="4" stroke-linecap="round"/>
<text x="610" y="133" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" font-weight="700" fill="#18212B" text-anchor="middle">Jeu</text>
<text x="610" y="154" font-family="Consolas, 'Cascadia Code', monospace" font-size="11.5" font-weight="400" fill="#5B6572" text-anchor="middle">script.js</text>
