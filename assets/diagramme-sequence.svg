<path d="M 612.0 465 L 690 465 L 690 495 L 614.0 495" fill="none" stroke="#18212B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#solidArrow)"/>
<text x="650" y="454" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#18212B" text-anchor="middle" stroke="#F6F7F8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">arbitrage</text>
<line x1="610" y1="550" x2="375" y2="550" stroke="#18212B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#solidArrow)"/>
<text x="492.5" y="539" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#18212B" text-anchor="middle" stroke="#F6F7F8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">révèle le résultat</text>
<line x1="610" y1="605" x2="1060" y2="605" stroke="#18212B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#solidArrow)"/>
<text x="835" y="594" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#18212B" text-anchor="middle" stroke="#F6F7F8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">met à jour le score</text>
<line x1="375" y1="655" x2="145" y2="655" stroke="#5B6572" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#openArrow)"/>
<text x="260" y="644" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#5B6572" text-anchor="middle" stroke="#F6F7F8" stroke-width="4" stroke-linejoin="round" paint-order="stroke">affiche le résultat et le score</text>
<line x1="56" y1="722" x2="86" y2="722" stroke="#18212B" stroke-width="1.5" marker-end="url(#solidArrow)"/>
<text x="94" y="727" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#5B6572" text-anchor="start">appel</text>
