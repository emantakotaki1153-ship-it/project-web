<ellipse cx="835" cy="190" rx="135" ry="40" fill="#EAF2FC" stroke="#0868E0" stroke-width="1.8"/>
<text x="835" y="196.125" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17.5" font-weight="600" fill="#18212B" text-anchor="middle">Choisir un coup</text>
