<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" role="img" aria-labelledby="uc-title uc-desc">
<title id="uc-title">Diagramme de cas d’utilisation — Pierre, Papier, Ciseaux</title>
<desc id="uc-desc">Le joueur lance une manche ; le système choisit un coup, détermine le gagnant et met à jour le score. Le joueur peut aussi réinitialiser la partie.</desc>
<rect width="1240" height="680" fill="#F6F7F8"/>
<defs>
<marker id="openBlue" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5 L10.5 6 L1.5 10.5" fill="none" stroke="#0868E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<text x="56" y="44" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18212B" text-anchor="start">UML — Diagramme de cas d’utilisation</text>
<text x="56" y="70" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15.5" font-weight="400" fill="#5B6572" text-anchor="start">Pierre · Papier · Ciseaux — application web statique</text>
