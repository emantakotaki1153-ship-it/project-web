<text x="835" y="319.04" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#18212B" text-anchor="middle">l’ordinateur</text>
<ellipse cx="835" cy="410" rx="135" ry="40" fill="#EAF2FC" stroke="#0868E0" stroke-width="1.8"/>
<text x="835" y="415.95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#18212B" text-anchor="middle">Déterminer le gagnant</text>
<ellipse cx="835" cy="520" rx="135" ry="40" fill="#EAF2FC" stroke="#0868E0" stroke-width="1.8"/>
<text x="835" y="525.95" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="600" fill="#18212B" text-anchor="middle">Mettre à jour le score</text>
